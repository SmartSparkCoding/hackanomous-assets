<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackanomous Asset Site</title>
    <meta
      name="description"
      content="Hackanomous YSWS Asset Site with quick PNG/SVG downloads."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="title-wrap">
        <p class="eyebrow">Hack Club YSWS</p>
        <h1>Hackanomous Asset Site</h1>
      </div>
      <nav class="header-actions" aria-label="Quick links">
        <a
          class="header-btn"
          href="https://hackanomous.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Main
        </a>
        <a
          class="header-btn"
          href="https://smartsparkcoding.github.io/hackanomous-rsvp-tracker/"
          target="_blank"
          rel="noopener noreferrer"
        >
          RSVPs
        </a>
        <a
          class="header-btn"
          href="https://github.com/SmartSparkCoding/hackanomous-assets/"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
      </nav>
    </header>

    <main>
      <section class="intro" aria-label="Intro">
        <p>
          Browse all official Hackanomous assets. Download each asset as PNG or SVG with one click.
        </p>
      </section>

      <section class="asset-grid" id="assetGrid" aria-label="Asset list"></section>
    </main>

    <footer class="site-footer">
      <p>VibeCoded for Easy Use by Jacob N (Organiser) for the Hackanomous Team</p>
    </footer>

    <script src="js/assets.config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
